# The whole stack: PostgreSQL, a one-off job that migrates and seeds the
# database, the API and the web app (nginx). Values come from the root `.env`
# (see .env.example); a missing one stops Compose with its name.
name: accommodation-rental-system

# The API's connection to the `db` service, on the Compose network.
x-database-url: &database-url postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Read by initdb/create-test-database.sh on the first start.
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:?set POSTGRES_TEST_DB in .env}
    ports:
      # Published on the loopback interface only.
      - '127.0.0.1:${POSTGRES_PORT:?set POSTGRES_PORT in .env}:5432'
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/18/docker.
      - db-data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies the migrations, loads data/*.csv and exits; the API starts only
  # after it has succeeded. It runs on every `up`: the seed inserts only missing
  # rows, so seeded rows deleted since come back (D-071).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    # A shell runs the two steps; as PID 1 it would ignore `docker stop`'s
    # SIGTERM, so a small init process handles the signals.
    init: true
    environment:
      DATABASE_URL: *database-url
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?set SEED_DEMO_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      PORT: ${API_PORT:?set API_PORT in .env}
      DATABASE_URL: *database-url
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:?set JWT_EXPIRES_IN in .env}
      LOG_LEVEL: ${LOG_LEVEL:?set LOG_LEVEL in .env}
      # One JSON object per line on stdout, collected by Docker.
      LOG_FORMAT: json
    ports:
      - '127.0.0.1:${API_PORT}:${API_PORT}'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # The slim image has no curl or wget; Node's fetch calls /api/health.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:' + process.env.PORT + '/api/health').then((res) => process.exit(res.ok ? 0 : 1), () => process.exit(1))",
        ]
      # Every 2 s while starting, so `web` starts soon after; then every 30 s,
      # which keeps the API's request log quiet.
      start_period: 30s
      start_interval: 2s
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL in .env}
    restart: unless-stopped
    environment:
      # Read by the nginx template (docker/web/default.conf.template).
      API_UPSTREAM: ${API_UPSTREAM:?set API_UPSTREAM in .env}
    ports:
      - '127.0.0.1:${WEB_PORT:?set WEB_PORT in .env}:80'
    depends_on:
      api:
        condition: service_healthy
        # nginx resolves `api` once, at startup; a recreated API container
        # gets a new address, so Compose restarts `web` after updating `api`.
        restart: true

volumes:
  db-data:
